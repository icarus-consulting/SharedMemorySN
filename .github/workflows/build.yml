name: SharedMemorySN-Release

on:
  pull_request:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Release build
        run: .\build.cmd

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: SharedMemorySN-release
          path: artifacts/*.nupkg